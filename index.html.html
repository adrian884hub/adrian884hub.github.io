<style>
  :root {
    --violet: #7B4FD1;
    --plum: #2A1745;
    --plum-deep: #1B0F2E;
    --lilac: #EFE7FB;
    --dim: #D1C4E9;
    --green: #0E7C66;
    --green-lt: #16C7A4;
    --card: rgba(42, 23, 69, 0.72);
    --card-line: rgba(239, 231, 251, 0.16);
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #1B0F2E; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background-color: #1B0F2E;
    background-image:
      radial-gradient(900px circle at 50% -10%, rgba(123,79,209,.38), rgba(27,15,46,0) 60%),
      radial-gradient(700px circle at 100% 100%, rgba(14,124,102,.20), rgba(27,15,46,0) 55%);
    background-attachment: fixed;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 18px 14px calc(40px + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
  }
  .main { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

  /* Aviso navegador interno */
  .inapp {
    display: none;
    padding: 12px 14px;
    border-radius: 16px;
    background: rgba(42,23,69,.96);
    border: 1px solid rgba(239,231,251,.28);
    color: #EFE7FB;
    font-size: 14px;
  }
  .inapp.on { display: block; }
  .inapp p { margin-bottom: 10px; color: #FFFFFF; line-height: 1.4; }
  .inapp .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
  .inapp .btn {
    border: 0; border-radius: 9px; padding: 8px 14px;
    background: #7B4FD1; color: #FFFFFF;
    font: inherit; font-size: 13px; font-weight: 700;
    text-decoration: none; cursor: pointer;
  }
  .inapp .btn.sec { background: rgba(239,231,251,.16); }

  /* ================= PORTADA: VIDEO + CÓDIGO ================= */
  .hero {
    position: relative;
    aspect-ratio: 4 / 6;
    border-radius: 24px;
    overflow: hidden;
    background: #1B0F2E;
    border: 1px solid rgba(239,231,251,.16);
    box-shadow: 0 18px 44px rgba(0,0,0,.5);
    animation: entra 1s var(--ease) both;
    isolation: isolate;
  }
  /* Fondo de respaldo (se ve si todavía no subiste el video) */
  .hero-fondo {
    position: absolute; inset: 0; z-index: 0;
    background-color: #1B0F2E;
    background-image:
      radial-gradient(420px circle at 70% 30%, rgba(123,79,209,.55), rgba(27,15,46,0) 65%),
      linear-gradient(rgba(239,231,251,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(239,231,251,.05) 1px, transparent 1px);
    background-size: auto, 32px 32px, 32px 32px;
  }
  /* Recuadro del video, del lado derecho, semitransparente */
  .marco {
    position: absolute; z-index: 1;
    right: 14px; top: 50px; bottom: 41%;
    width: 60%;
    border-radius: 18px;
    overflow: hidden;
    background: #1B0F2E;
    border: 1px solid rgba(239,231,251,.30);
    box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(123,79,209,.28);
  }
  .marco video {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 30%;
    display: block;
    opacity: .66;            /* transparencia: bajalo para ver más código, subilo para ver más video */
    filter: saturate(.92) contrast(1.05);
  }
  /* Tinte violeta sobre el video para que combine con la página */
  .marco::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(123,79,209,.34) 0%, rgba(27,15,46,.10) 65%);
  }
  /* Sombra suave a la izquierda para que el código se lea */
  .hero-sombra {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(90deg, rgba(27,15,46,.55) 0%, rgba(27,15,46,0) 62%);
  }

  /* Columna de código a la izquierda */
  .codigo {
    position: absolute; z-index: 3;
    left: 0; top: 0; bottom: 0;
    width: 100%;
    overflow: hidden;
    padding: 46px 0 0 14px;
    -webkit-mask-image: linear-gradient(to right, #000 0%, #000 40%, rgba(0,0,0,.55) 100%);
            mask-image: linear-gradient(to right, #000 0%, #000 40%, rgba(0,0,0,.55) 100%);
  }
  .codigo-mov {
    animation: sube-codigo 46s linear infinite;
    will-change: transform;
  }
  .codigo pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    font-size: 11.5px;
    line-height: 1.65;
    color: #E9DDF8;
    white-space: pre;
  }
  .codigo .c { color: #7EE7C7; }   /* comentarios */
  .codigo .k { color: #C4A8FF; }   /* palabras clave */
  .codigo .s { color: #F5C77E; }   /* textos */
  .codigo .f { color: #8FC7FF; }   /* funciones */

  /* Barrita tipo editor arriba a la izquierda */
  .tab {
    position: absolute; z-index: 5;
    left: 0; top: 0;
    display: flex; align-items: center; gap: 6px;
    padding: 12px 14px 26px;
    width: 100%;
    background: linear-gradient(to bottom, #1B0F2E 0%, #1B0F2E 55%, rgba(27,15,46,0) 100%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    color: #D1C4E9;
  }
  .tab i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .tab i:nth-child(1) { background: #FF5F57; }
  .tab i:nth-child(2) { background: #FEBC2E; }
  .tab i:nth-child(3) { background: #28C840; }
  .tab span { margin-left: 8px; }

  /* Degradado inferior + textos */
  .hero-grad {
    position: absolute; inset: 0; z-index: 4;
    background: linear-gradient(to bottom, rgba(27,15,46,0) 38%, rgba(27,15,46,.92) 60%, rgba(27,15,46,.98) 100%);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 20px;
  }
  .estado {
    display: inline-flex; align-items: center; gap: 8px;
    width: fit-content;
    padding: 5px 11px; margin-bottom: 10px;
    border-radius: 999px;
    background: rgba(14,124,102,.38);
    border: 1px solid rgba(22,199,164,.55);
    color: #C4F8EA;
    font-size: 12.5px; font-weight: 600;
  }
  .estado i {
    position: relative; width: 8px; height: 8px; border-radius: 50%;
    background: #16C7A4; display: inline-block;
  }
  .estado i::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: #16C7A4; animation: pulso 2s ease-out infinite;
  }
  .hero h1 {
    font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em;
    color: #FFFFFF; margin-bottom: 4px;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .lugar {
    display: flex; align-items: center; gap: 5px;
    font-size: 13.5px; color: #EFE7FB; margin-bottom: 6px;
  }
  .lugar svg { width: 14px; height: 14px; fill: #EFE7FB; flex-shrink: 0; }
  .titulo { font-size: 14.5px; color: #D1C4E9; line-height: 1.35; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; }
  .chips li {
    padding: 3px 9px; border-radius: 7px;
    background: rgba(239,231,251,.12);
    border: 1px solid rgba(239,231,251,.22);
    color: #FFFFFF; font-size: 12px; font-weight: 500;
  }

  /* ================= BOTONES ================= */
  .links { display: flex; flex-direction: column; gap: 12px; }
  .item {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px;
    border-radius: 16px;
    background: rgba(42,23,69,.72);
    border: 1px solid rgba(239,231,251,.16);
    color: #FFFFFF; text-decoration: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    opacity: 0;
    animation: entra-item .6s var(--ease) both;
    transition: transform .28s var(--ease), box-shadow .28s var(--ease), border-color .28s var(--ease), background-color .28s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .item .luz {
    position: absolute; z-index: 1;
    top: var(--gy, -100px); left: var(--gx, -100px);
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(196,168,255,.28) 0%, rgba(196,168,255,0) 70%);
    transform: translate(-50%, -50%);
    opacity: 0; transition: opacity .3s ease; pointer-events: none;
  }
  .item:hover .luz { opacity: 1; }
  .item:hover {
    transform: translateY(-3px);
    background-color: rgba(123,79,209,.26);
    border-color: rgba(239,231,251,.42);
    box-shadow: 0 12px 26px rgba(0,0,0,.42);
  }
  .item:active { transform: translateY(-1px) scale(.985); }
  .item:focus-visible { outline: 2px solid #EFE7FB; outline-offset: 3px; }

  .izq { display: flex; align-items: center; gap: 14px; min-width: 0; position: relative; z-index: 2; }
  .icono {
    width: 44px; height: 44px; flex-shrink: 0;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(239,231,251,.10);
    border: 1px solid rgba(239,231,251,.14);
    transition: transform .35s var(--ease), background-color .3s ease;
  }
  .icono svg { width: 22px; height: 22px; fill: #FFFFFF; }
  .item:hover .icono { transform: rotate(-8deg) scale(1.1); background: rgba(239,231,251,.18); }
  .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .nombre { font-size: 15.5px; font-weight: 700; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { font-size: 13px; color: #D1C4E9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flecha {
    width: 20px; height: 20px; flex-shrink: 0; fill: #EFE7FB;
    position: relative; z-index: 2;
    transition: transform .3s var(--ease);
  }
  .item:hover .flecha { transform: translateX(5px); }

  /* Botón principal (WhatsApp) */
  .item.principal {
    background: linear-gradient(135deg, rgba(14,124,102,.9) 0%, rgba(42,23,69,.96) 100%);
    border-color: rgba(22,199,164,.5);
    box-shadow: 0 6px 22px rgba(14,124,102,.28);
  }
  .item.principal:hover {
    background: linear-gradient(135deg, rgba(14,124,102,1) 0%, rgba(42,23,69,1) 100%);
    border-color: rgba(22,199,164,.85);
    box-shadow: 0 12px 30px rgba(14,124,102,.42);
  }
  .item.principal::after {
    content: ""; position: absolute; top: -50%; left: -80%;
    width: 45%; height: 200%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,.26), transparent);
    transform: rotate(26deg);
    animation: brillo 4.8s ease-in-out 1.6s infinite;
    pointer-events: none;
  }

  /* ================= LOGOS ================= */
  .logos {
    list-style: none;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
    padding: 6px 0 2px;
  }
  .logos li {
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px;
    background: rgba(42,23,69,.72);
    border: 1px solid rgba(239,231,251,.16);
    transition: transform .28s var(--ease), background-color .28s var(--ease), border-color .28s var(--ease);
  }
  .logos li:hover { transform: translateY(-3px); background: rgba(123,79,209,.26); border-color: rgba(239,231,251,.42); }
  .logos img { width: 62%; height: 62%; display: block; object-fit: contain; }
  .logos svg { width: 52%; height: 52%; fill: #EFE7FB; }

  footer { text-align: center; padding: 14px 0 4px; font-size: 12.5px; color: #D1C4E9; }

  @keyframes entra { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes entra-item { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes pulso { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
  @keyframes brillo { 0%, 60% { left: -80%; } 100% { left: 140%; } }
  @keyframes sube-codigo { from { transform: translateY(0); } to { transform: translateY(-50%); } }

  @media (max-width: 360px) {
    body { padding: 12px 10px 30px; }
    .hero h1 { font-size: 29px; }
    .codigo pre { font-size: 10.5px; }
    .item { padding: 12px 14px; gap: 10px; }
    .icono { width: 38px; height: 38px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .item { opacity: 1 !important; }
  }

  /* Barrita finita "Abrir en Google" */
  .inapp { padding: 0; background: none; border: 0; border-radius: 0; margin-bottom: -6px; }
  .btn-google {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 34px;
    border-radius: 999px;
    background: rgba(123,79,209,.85);
    border: 1px solid rgba(239,231,251,.35);
    color: #FFFFFF; font-size: 13px; font-weight: 700;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-google:active { transform: scale(.98); }

  /* ===== SOLO DENTRO DE TIKTOK (el navegador normal no se toca) ===== */
  .tiktok .inapp { display: none !important; }          /* sin el botón "Abrir página en Google" */
  .tiktok .chips { display: none; }                     /* sin etiquetas (Python, Ecommerce...) */
  .tiktok .hero h1 { font-size: 24px; margin-bottom: 3px; }
  .tiktok .titulo { font-size: 12px; line-height: 1.35; margin-bottom: 0; }
  .tiktok .lugar { font-size: 12px; margin-bottom: 5px; }
  .tiktok .estado { font-size: 11px; margin-bottom: 8px; }
</style>

  /* ==========================================================
     4) ABRIR FUERA DE TIKTOK / INSTAGRAM / FACEBOOK
     ========================================================== */
  var ua = navigator.userAgent || "";
  var enApp = /TikTok|musical_ly|Bytedance|trill|Instagram|FBAN|FBAV|FB_IAB/i.test(ua);
  var esTikTok = /TikTok|musical_ly|Bytedance|trill/i.test(ua);
  var esAndroid = /Android/i.test(ua);
  var esIOS = /iPhone|iPad|iPod/i.test(ua);

  function aIntent(url) {
    var u = new URL(url);
    return "intent://" + u.host + u.pathname + u.search + u.hash +
      "#Intent;scheme=" + u.protocol.replace(":", "") +
      ";package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
  }

  /* Solo en Android dentro de una red social: una barrita finita arriba */
  if (enApp && esAndroid && !esTikTok) {
    var caja = document.getElementById("inapp");
    var acc = document.getElementById("inappAcc");
    var ab = document.createElement("a");
    ab.className = "btn-google";
    ab.textContent = "Abrir página en Google";
    ab.href = aIntent(location.href);
    acc.appendChild(ab);
    caja.classList.add("on");
  }

  /* ==========================================================
     5) ARMAR LOS BOTONES
     ========================================================== */
  var flecha = '<svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-7.85-1.42 1.42L16.86 11H5v2z"/></svg>';
  var cont = document.getElementById("links");
  var n = 0;

  /* Solo en TikTok: primer botón "Abrí aquí" para salir al navegador del celular.
     - Android: usa el link tipo intent en su forma más simple (la que mejor funciona).
     - iPhone: TikTok no permite salir con un link, así que el botón explica cómo hacerlo. */
  if (esTikTok) {
    LINKS.unshift({
      id: "abrir",
      titulo: "Abrí aquí",
      desc: "Verla completa en tu navegador",
      url: esIOS ? "#" : "intent://" + location.host + location.pathname + location.search + "#Intent;scheme=https;end",
      icono: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>'
    });
  }

  /* Copiar texto (para el mail dentro de TikTok, que no deja abrir apps de correo) */
  function copiar(texto, ok, fallo) {
    function planB() {
      try {
        var t = document.createElement("textarea");
        t.value = texto; t.style.position = "fixed"; t.style.opacity = "0";
        document.body.appendChild(t); t.select();
        var listo = document.execCommand("copy");
        document.body.removeChild(t);
        listo ? ok() : fallo();
      } catch (e) { fallo(); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(ok, planB);
    } else { planB(); }
  }

  LINKS.forEach(function (l) {
    if (!l.url) return;
    var a = document.createElement("a");
    a.className = "item" + (l.principal ? " principal" : "");

    /* En TikTok el navegador interno bloquea los links "intent://" y las ventanas nuevas
       (da el error "esta acción no se puede completar"), así que ahí los botones
       son links comunes, sin trucos. En el resto queda igual que antes. */
    var afuera = enApp && esAndroid && !esTikTok && l.id !== "whatsapp" && l.id !== "gmail";
    a.href = afuera ? aIntent(l.url) : l.url;
    if (!afuera && !esTikTok) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    a.style.animationDelay = (0.4 + 0.09 * n++) + "s";

    var luz = document.createElement("div");
    luz.className = "luz";
    luz.setAttribute("aria-hidden", "true");

    var izq = document.createElement("div");
    izq.className = "izq";

    var ic = document.createElement("div");
    ic.className = "icono";
    ic.setAttribute("aria-hidden", "true");
    ic.innerHTML = l.icono;

    var tx = document.createElement("div");
    tx.className = "txt";
    var t1 = document.createElement("span");
    t1.className = "nombre";
    t1.textContent = l.titulo;
    var t2 = document.createElement("span");
    t2.className = "desc";
    t2.textContent = l.desc;
    tx.appendChild(t1);
    tx.appendChild(t2);

    izq.appendChild(ic);
    izq.appendChild(tx);
    a.appendChild(luz);
    a.appendChild(izq);
    a.insertAdjacentHTML("beforeend", flecha);

    if (esTikTok && l.id === "abrir" && esIOS) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        t2.textContent = "Tocá ⋯ → Abrir en el navegador";
      });
    }
    if (esTikTok && l.id === "gmail") {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        copiar("adrianpereyra884@gmail.com", function () {
          t2.textContent = "¡Correo copiado!";
          setTimeout(function () { t2.textContent = l.desc; }, 2500);
        }, function () { window.location.href = l.url; });
      });
    }

    a.addEventListener("pointermove", function (e) {
      var r = a.getBoundingClientRect();
      a.style.setProperty("--gx", (e.clientX - r.left) + "px");
      a.style.setProperty("--gy", (e.clientY - r.top) + "px");
    });

    cont.appendChild(a);
  });
})();
